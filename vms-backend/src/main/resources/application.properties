# Server Configuration
server.port=8081

# Application Name
spring.application.name=vms-backend

# H2 Database Configuration (File-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/vmsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL Script Initialization (Seeds data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Security Configuration
app.jwt.secret=stark-group-vms-secret-key-super-secure-token-2026-datavvy-assignment-key-32bytes
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.starkgroup.vms=DEBUG
logging.level.org.springframework.security=INFO
