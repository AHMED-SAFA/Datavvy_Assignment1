server.port=8081
spring.application.name=vms-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vmsdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Seed data.sql at startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# JWT Security
app.jwt.secret=stark-group-vms-secret-key-super-secure-token-2026-datavvy-assignment-key-32bytes
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.starkgroup.vms=DEBUG
logging.level.org.springframework.security=INFO
